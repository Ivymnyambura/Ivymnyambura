
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="250"
     viewBox="0 0 1000 250">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15111F"/>
      <stop offset="100%" stop-color="#39276F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="250"
        rx="16" fill="url(#bg)"/>

  <!-- Decorative accents -->
  <circle cx="900" cy="35" r="115"
          fill="#7654BC" opacity=".16"/>
  <circle cx="970" cy="210" r="135"
          fill="#A9B8FF" opacity=".07"/>

  <!-- Header label -->
  <rect x="38" y="30" width="8" height="8"
        rx="2" fill="#B8F28B"/>

  <text x="60" y="39"
        fill="#A9B8FF"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="3">
    DEVELOPER / CREATIVE TECHNOLOGIST
  </text>

  <!-- Name -->
  <text x="38" y="117"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-weight="bold"
        font-size="59">
    ivy nyambura
  </text>

  <circle cx="405" cy="108" r="6"
          fill="#B8F28B"/>

  <!-- Tagline -->
  <text x="40" y="155"
        fill="#A9B8FF"
        font-family="Arial, sans-serif"
        font-size="19">
    Engineering ideas. Crafting experiences.
  </text>

  <!-- Specialty badges -->
  <rect x="40" y="185" width="118" height="29"
        rx="5" fill="#7654BC"/>

  <text x="99" y="204" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" fill="#FFFFFF">
    FULL STACK
  </text>

  <rect x="168" y="185" width="86" height="29"
        rx="5" fill="#7654BC"/>

  <text x="211" y="204" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" fill="#FFFFFF">
    AI / ML
  </text>

  <rect x="264" y="185" width="127" height="29"
        rx="5" fill="#B8F28B"/>

  <text x="327" y="204" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" fill="#15111F">
    OPEN TO WORK
  </text>

  <!-- Footer detail -->
  <text x="962" y="222" text-anchor="end"
        fill="#A9B8FF"
        font-family="monospace"
        font-size="12">
    001 / IVY
  </text>

</svg>
